name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fqa-empleos-frontend:${{ github.sha }}
      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fqa-empleos-backend:${{ github.sha }}
      - name: Desplegar en DigitalOcean
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/fqa-empleos
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml run --rm backend npx prisma migrate deploy
            docker compose -f docker-compose.yml up -d --remove-orphans
